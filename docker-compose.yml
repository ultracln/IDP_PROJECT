version: "3.8"

services:

  bookswap-app-db:
    image: postgres:13.2-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - bookswap-net
    deploy:
      placement:
        constraints: [node.role == manager]

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - bookswap-net
    deploy:
      replicas: 1

  auth-service:
    image: bookswap/auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bookswap-app-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8081"
    networks:
      - bookswap-net
    deploy:
      replicas: 1

  book-service:
    image: bookswap/book-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://bookswap-app-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8082:8082"
    networks:
      - bookswap-net
    deploy:
      replicas: 1

volumes:
  pg_data:

networks:
  bookswap-net:
    driver: overlay
