name: CI/CD Pipeline with Versioned Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Auth Service
        working-directory: ./auth-service
        run: mvn clean package -DskipTests

      - name: Build Book Service
        working-directory: ./book-service
        run: mvn clean package -DskipTests

      - name: Get short commit SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Auth Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest -t ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ steps.vars.outputs.sha }} ./auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:${{ steps.vars.outputs.sha }}

      - name: Build and Push Book Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-service:latest -t ${{ secrets.DOCKER_USERNAME }}/book-service:${{ steps.vars.outputs.sha }} ./book-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/book-service:${{ steps.vars.outputs.sha }}

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest -t ${{ secrets.DOCKER_USERNAME }}/frontend:${{ steps.vars.outputs.sha }} ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:${{ steps.vars.outputs.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make deploy script executable
        run: chmod +x ./deploy.sh

      - name: Run deployment script
        run: ./deploy.sh
