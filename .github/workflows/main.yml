name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Auth Service with Maven
        working-directory: ./auth-service
        run: mvn clean package -DskipTests

      - name: Build Book Service with Maven
        working-directory: ./book-service
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Auth Service Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest ./auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

      - name: Build and Push Book Service Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/book-service:latest ./book-service
          docker push ${{ secrets.DOCKER_USERNAME }}/book-service:latest
