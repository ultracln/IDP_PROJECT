_format_version: "2.1"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
        strip_path: false

  - name: book-service
    url: http://book-service:8082
    routes:
      - name: book-routes
        paths:
          - /book
          - /offers
        strip_path: false


consumers:
  - username: bookswap-client

jwt_secrets:
  - consumer: bookswap-client
    key: bookswap-client
    algorithm: HS512
    secret: bookswap-super-secret-key-must-be-at-least-64-characters-long!!!!

plugins:
  - name: jwt
    service: book-service
    config:
      key_claim_name: iss