_format_version: "2.1"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
        strip_path: false

  - name: book-service
    url: http://book-service:8082
    routes:
      - name: book-routes
        paths:
          - /book
          - /offers
        strip_path: false


consumers:
  - username: bookswap-client

jwt_secrets:
  - consumer: bookswap-client
    key: bookswap-client
    algorithm: HS512
    secret: Vp47vXw3PVh7wEqmiT9EhK3Dfs4nVaG9W4g8UCZDWl+M3K7t4cKnVCR4Lvx3V8zEhR3A4P3ehFQsM5vU7cqA5g==

plugins:
  - name: jwt
    service: book-service
    config:
      key_claim_name: iss
      secret_is_base64: true